<!DOCTYPE html>

<head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-logo" href="index.html">Profile Site</a>
      <button class="menu-button" type="button" aria-controls="global-nav" aria-expanded="false" aria-label="メニューを開く">
        <span></span>

        <span></span>
      </button>
      <nav id="global-nav" class="global-nav" aria-label="グローバルナビゲーション">

          <li><a href="index.html">TOP</a></li>
          <li><a href="about.html">About</a></li>

          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
<section class="page-hero" data-fade>
  <div class="container page-hero__layout">

    <div>
      <p class="section-label">Favorite</p>
      <h1>好きなもの</h1>
      <p>アウトドアもインドアも両方好きです！</p>
    </div>

    <section
      class="slider"
      data-slider
      aria-label="好きなものの画像スライダー"
    >
      <div class="slider__viewport">
        <div class="slider__track" data-slider-track>

          <figure class="slider__slide">
            <img
              src="images/favorite-game.png"
              alt="ゲームをしているイメージ"
            >
            <figcaption>ゲーム</figcaption>
          </figure>

          <figure class="slider__slide">
            <img
              src="images/favorite-fishing.jpg"
              alt="生きものイメージ"
            >
            <figcaption>生き物</figcaption>
          </figure>

          <figure class="slider__slide">
            <img
              src="images/favorite-dog.jpg"
              alt="犬のイメージ"
            >
            <figcaption>愛犬を撫でること</figcaption>
          </figure>

        </div>
      </div>

      <div class="slider__controls">
        <button
          class="slider__button"
          type="button"
          data-slider-prev
          aria-label="前の画像へ"
        >
          <
        </button>

        <div
          class="slider__dots"
          data-slider-dots
          aria-label="スライダー位置"
        ></div>

        <button
          class="slider__button"
          type="button"
          data-slider-next
          aria-label="次の画像へ"
        >
          >
        </button>
      </div>
    </section>

  </div>
</section>

    <section class="section" data-fade>
      <div class="container">
        <div class="section-heading">
          <p class="section-label">Favorite Cards</p>
          <h2>好きなもの一覧</h2>
        </div>
        <div class="card-grid card-grid--favorite">
          <article class="favorite-card">
            <span class="favorite-card__number">01</span>
            <h3>Favorite 01</h3>
            <p>ゲーム</p>
          </article>
          <article class="favorite-card">
            <span class="favorite-card__number">02</span>
            <h3>Favorite 02</h3>
            <p>生き物</p>
          </article>
          <article class="favorite-card">
            <span class="favorite-card__number">03</span>
            <h3>Favorite 03</h3>
            <p>愛犬を撫でる</p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">

      <p>&copy; 2026 Profile Site.</p>
